name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'
      prerelease:
        description: 'Mark as pre-release (beta)?'
        required: false
        default: 'false'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
            $pre = "${{ github.event.inputs.prerelease }}"
          } else {
            $tag = "${{ github.ref_name }}"
            $pre = "false"
          }
          $version = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "zip_name=EldenDeathCounter-${tag}-win-x64.zip" >> $env:GITHUB_OUTPUT
          echo "prerelease=$pre" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore EldenDeathCounter.sln

      - name: Test
        run: dotnet test EldenDeathCounter.sln --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Publish
        run: >
          dotnet publish src/EldenDeathCounter/EldenDeathCounter.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/EldenDeathCounter
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/EldenDeathCounter/* -DestinationPath "${{ steps.version.outputs.zip_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EldenDeathCounter ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body: |
            ## EldenDeathCounter ${{ steps.version.outputs.tag }}

            ### Instalacja
            1. Pobierz `${{ steps.version.outputs.zip_name }}` poniżej.
            2. Wypakuj zip do dowolnego folderu.
            3. Uruchom `EldenDeathCounter.exe`.
            4. .NET nie jest wymagany — runtime jest dołączony.

            ### Wymagania
            - Windows 10 w wersji 19041 (20H1) lub nowszy (64-bit)

            ### Uwaga
            Jeśli Windows SmartScreen wyświetli ostrzeżenie, kliknij "Więcej informacji" → "Uruchom mimo to".
          files: ${{ steps.version.outputs.zip_name }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

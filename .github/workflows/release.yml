Sekwencja implementacji
Checkout lub utwórz branch `claude/app-build-distribution-0dNHu`
Utwórz `.github/workflows/release.yml`
Zaktualizuj `README.md`
Commit i push
Jak triggować release po implementacji
```bash
# Stabilny release z mastera:
git tag v1.2.0
git push origin v1.2.0
# → pipeline odpali się automatycznie

# Beta pre-release (ręcznie):
# GitHub → Actions → Release → Run workflow → prerelease: true
```
---
Weryfikacja
Po pushu tagu: Actions → pipeline restore → test → publish → zip → release
Releases page: pojawia się `EldenDeathCounter-v1.2.0-win-x64.zip`
Pobrać zip, wypakować, uruchomić `EldenDeathCounter.exe` na Windows — startuje bez .NET
Potencjalne problemy
Uprawnienia GITHUB_TOKEN: jeśli release step zwróci 403 → Settings → Actions → General → Workflow permissions → "Read and write permissions"
SmartScreen: exe bez podpisu kodu — ostrzeżenie przy pierwszym uruchomieniu (opisane w release notes)